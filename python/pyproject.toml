[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etwkit"
version = "0.1.0"
description = "Reader and live tooling for etwkit ETW JSONL telemetry"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
etwkit-live = "etwkit.live:main"

[tool.setuptools]
packages = ["etwkit"]
